name: AI CI doctor

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  explain:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
      models: read
    steps:
      - uses: actions/checkout@v6        # default branch: trusted code only
      - name: Download failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log
      - name: Ask the model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ai/llm.py --prompt .github/prompts/ci-doctor.md --data failed.log --tag log > comment.md
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
