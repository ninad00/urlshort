name: AI review

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      models: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Collect the diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE"...HEAD > pr.diff
      - name: Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ai/llm.py --prompt .github/prompts/review.md --data pr.diff --tag diff > review.md
      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file review.md
