version: 2
updates:
  # Python packages in requirements.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7            # wait 7 days before suggesting a new version (security fixes are not delayed)
    groups:
      python-minor-and-patch:    # small updates come together in one PR
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:                   # all action updates in one PR
        patterns: ["*"]

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
